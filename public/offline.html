<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thành Phố An Toàn - Đang Ngoại Tuyến</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f0f9ff;
      color: #1e293b;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    }
    h1 { color: #0284c7; margin-top: 16px; font-size: 24px; }
    p { color: #64748b; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      background: #0284c7;
      color: white;
      padding: 12px 24px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 64px;">📴</div>
    <h1>Chế độ Ngoại tuyến</h1>
    <p>Bạn đang không có kết nối Internet. Đừng lo, các bài học đã tải về vẫn sẵn sàng trong Thành Phố An Toàn!</p>
    <a href="/" class="btn">Trở về Trang chủ</a>
  </div>
</body>
</html>
